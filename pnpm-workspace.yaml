# pnpm 10 settings live here — package.json's `pnpm.onlyBuiltDependencies` is no
# longer read. better-sqlite3 is an *optional* dependency (Spec 51: node:sqlite
# is the primary backend on Node 23.4+), but the dev repo still builds it so the
# fallback backend can be parity-tested on this checkout. esbuild needs its
# postinstall to produce its binary for tsx/vitest.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
